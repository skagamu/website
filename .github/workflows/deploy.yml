name: Deploy Next.js to GitHub Pages

on:
  # Berjalan otomatis setiap ada push ke branch main
  push:
    branches: ["main"]
  # Memungkinkan trigger manual dari tab Actions GitHub
  workflow_dispatch:

# Konfigurasi izin yang wajib untuk GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Mencegah deployment yang tumpang tindih jika ada commit beruntun
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ==========================================
  # JOB 1: BUILD APLIKASI NEXT.JS
  # ==========================================
  build:
    runs-on: ubuntu-latest
    
    # Mengatur default path agar perintah `run` mengeksekusi di dalam folder smk-profile
    defaults:
      run:
        working-directory: ./smk-profile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          # Menentukan lokasi spesifik lockfile karena tidak berada di root
          cache-dependency-path: ./smk-profile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js Static Export
        run: npm run build
        env:
          # Pastikan path URL sesuai kalau dipublish di subdomain (opsional, biarkan default jika custom domain)
          # NEXT_PUBLIC_BASE_PATH: /nama-repo
          NODE_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Target folder out Next.js (dari hasil output: 'export')
          path: ./smk-profile/out

  # ==========================================
  # JOB 2: DEPLOY KE GITHUB PAGES
  # ==========================================
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
