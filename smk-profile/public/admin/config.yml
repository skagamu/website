backend:
  name: github
  repo: skagamu/website
  branch: main
media_folder: "smk-profile/public/media"
public_folder: "/website/media"

# Optimize raster photos in the browser before they are committed to the repo.
media_libraries:
  all:
    transformations:
      raster_image:
        format: webp
        quality: 85
        width: 2048
        height: 2048

collections:
  - name: "beranda_hero"
    label: "Beranda · Hero"
    icon: "image"
    description: "Atur slide utama yang tampil di beranda."
    files:
      - label: "Slide utama"
        name: "hero"
        file: "smk-profile/data/hero.json"
        fields:
          - label: "Slide beranda"
            name: "slides"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Label kecil", name: "label", widget: "string" }
              - { label: "Judul dua baris", name: "headline", widget: "list", field: { label: "Baris judul", name: "line", widget: "string" }, min: 2, max: 2 }
              - { label: "Deskripsi", name: "description", widget: "text" }
              - { label: "Durasi (ms)", name: "durationMs", widget: "number", value_type: "int", min: 1000 }
              - { label: "Gambar / poster", name: "image", widget: "image" }
              - { label: "Video", name: "videoSrc", widget: "file", required: false }
              - { label: "Posisi gambar", name: "objectPosition", widget: "string", required: false }

  - name: "visi_misi"
    label: "Beranda · Visi dan Misi"
    icon: "favorite"
    description: "Perbarui pernyataan, visi, dan butir misi sekolah."
    files:
      - label: "Visi dan misi"
        name: "manifesto"
        file: "smk-profile/data/manifesto.json"
        fields:
          - label: "Pernyataan utama"
            name: "manifesto"
            widget: "object"
            fields:
              - { label: "Pernyataan", name: "statement", widget: "text" }
              - { label: "Visi", name: "vision", widget: "text" }
              - label: "Misi"
                name: "mission"
                widget: "list"
                field: { label: "Butir misi", name: "item", widget: "string" }

  - name: "artikel"
    label: "Kabar Sekolah · Artikel"
    icon: "article"
    description: "Tambah dan ubah artikel; URL dibuat dari judul artikel."
    folder: "smk-profile/data/kabar-sekolah"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "id"
    fields:
      - { label: "ID artikel", name: "id", widget: "string", hint: "ID stabil untuk tautan; gunakan slug artikel, jangan diubah setelah dipublikasikan." }
      - { label: "Judul artikel", name: "title", widget: "string" }
      - { label: "Tanggal", name: "date", widget: "string" }
      - { label: "Kategori", name: "category", widget: "select", options: ["berita-akademik", "pengumuman", "event"] }
      - { label: "Label kategori", name: "categoryLabel", widget: "string" }
      - { label: "Ringkasan", name: "excerpt", widget: "text" }
      - { label: "Isi artikel", name: "body", widget: "text", required: false, hint: "Pisahkan paragraf dengan baris kosong." }
      - { label: "Gambar", name: "image", widget: "image" }
      - { label: "Keterangan", name: "meta", widget: "string", required: false }

  - name: "kabar_sections"
    label: "Kabar Sekolah · Bagian halaman"
    icon: "article"
    description: "Atur bagian pengantar pada halaman kabar sekolah."
    files:
      - label: "Bagian kabar sekolah"
        name: "sections"
        file: "smk-profile/data/kabar-sekolah.json"
        fields:
          - label: "Bagian konten"
            name: "contentSections"
            widget: "list"
            fields:
              - { label: "ID bagian", name: "id", widget: "string" }
              - { label: "Label kecil", name: "eyebrow", widget: "string" }
              - { label: "Judul", name: "title", widget: "string" }
              - { label: "Gambar", name: "image", widget: "image" }
              - { label: "Teks alternatif gambar", name: "imageAlt", widget: "string" }
              - { label: "Posisi gambar", name: "imagePosition", widget: "select", options: ["left", "right"] }
              - label: "Paragraf"
                name: "paragraphs"
                widget: "list"
                field: { label: "Paragraf", name: "paragraph", widget: "text" }

  - name: "programs"
    label: "Program Keahlian"
    label_singular: "Program"
    icon: "school"
    description: "Kelola tiap item sebagai entri tersendiri; urutan dapat diubah di daftar."
    file: "smk-profile/data/programs.json"
    create: false
    delete: false
    identifier_field: "id"
    fields:
      - { label: "ID URL", name: "id", widget: "hidden" }
      - { label: "Nama program", name: "name", widget: "string" }
      - { label: "Subjudul kartu", name: "subtitle", widget: "string", required: false }
      - { label: "Gambar program", name: "image", widget: "image" }
      - { label: "Deskripsi singkat", name: "description", widget: "text" }
      - { label: "Ikon", name: "icon", widget: "select", options: ["wrench", "shopping-cart", "calculator"] }
      - { label: "Tagline halaman detail", name: "tagline", widget: "string" }
      - label: "Paragraf detail"
        name: "detailParagraphs"
        widget: "list"
        field: { label: "Paragraf", name: "paragraph", widget: "text" }
      - label: "Kompetensi unggulan"
        name: "competencies"
        widget: "list"
        field: { label: "Kompetensi", name: "kompetensi", widget: "string" }
      - label: "Prospek karier"
        name: "careers"
        widget: "list"
        field: { label: "Karier", name: "karier", widget: "string" }
      - label: "Mitra industri"
        name: "partners"
        widget: "list"
        field: { label: "Mitra", name: "mitra", widget: "string" }
      - label: "Fasilitas program"
        name: "facilities"
        widget: "list"
        fields:
          - { label: "Nama fasilitas", name: "title", widget: "string" }
          - { label: "Gambar", name: "image", widget: "image" }
          - { label: "Keterangan", name: "caption", widget: "text" }

  - name: "alumni"
    label: "Alumni"
    label_singular: "Alumni"
    icon: "people"
    description: "Kelola tiap item sebagai entri tersendiri; urutan dapat diubah di daftar."
    file: "smk-profile/data/alumni.json"
    create: true
    delete: true
    identifier_field: "name"
    fields:
      - { label: "ID", name: "id", widget: "uuid", hint: "Dibuat otomatis; biarkan apa adanya." }
      - { label: "Nama", name: "name", widget: "string" }
      - { label: "Program keahlian", name: "major", widget: "string" }
      - { label: "Angkatan", name: "year", widget: "string" }
      - { label: "Pekerjaan", name: "role", widget: "string" }
      - { label: "Perusahaan", name: "company", widget: "string" }
      - { label: "Foto", name: "image", widget: "image", required: false, hint: "Opsional; tanpa foto akan tampil inisial nama." }

  - name: "acara"
    label: "Kegiatan & Acara"
    label_singular: "Kegiatan"
    icon: "event"
    description: "Kelola tiap item sebagai entri tersendiri; urutan dapat diubah di daftar."
    file: "smk-profile/data/events.json"
    create: true
    delete: true
    identifier_field: "id"
    fields:
      - { label: "ID", name: "id", widget: "uuid", hint: "Dibuat otomatis; biarkan apa adanya." }
      - { label: "Judul", name: "title", widget: "string" }
      - { label: "Tanggal tampilan", name: "date", widget: "string" }
      - { label: "Tanggal ISO", name: "dateISO", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Status", name: "status", widget: "select", options: ["Upcoming", "Past"] }
      - { label: "Ringkasan", name: "excerpt", widget: "text" }
      - { label: "Kategori", name: "category", widget: "string" }
      - { label: "Lokasi", name: "location", widget: "string" }
      - { label: "Gambar", name: "image", widget: "image" }
      - { label: "Warna kartu", name: "theme", widget: "select", options: ["blue", "green", "purple", "rose", "orange"] }
      - { label: "Tautan artikel terkait", name: "href", widget: "string", required: false, hint: "Kosongkan jika belum ada artikel detail yang sesuai." }

  - name: "guru"
    label: "Guru & Staf"
    label_singular: "Guru atau staf"
    icon: "people"
    description: "Kelola tiap item sebagai entri tersendiri; urutan dapat diubah di daftar."
    file: "smk-profile/data/faculty.json"
    create: true
    delete: true
    identifier_field: "id"
    fields:
      - { label: "ID", name: "id", widget: "uuid", hint: "Dibuat otomatis; biarkan apa adanya." }
      - { label: "Nama", name: "name", widget: "string" }
      - { label: "Jabatan", name: "role", widget: "string" }
      - { label: "Foto", name: "image", widget: "image" }

  - name: "galeri"
    label: "Galeri Sekolah"
    label_singular: "Foto galeri"
    icon: "image"
    description: "Kelola tiap item sebagai entri tersendiri; urutan dapat diubah di daftar."
    file: "smk-profile/data/gallery.json"
    create: true
    delete: true
    identifier_field: "id"
    fields:
      - { label: "ID", name: "id", widget: "uuid", hint: "Dibuat otomatis; biarkan apa adanya." }
      - { label: "Judul", name: "title", widget: "string" }
      - { label: "Kategori", name: "category", widget: "string" }
      - { label: "Tata letak", name: "layout", widget: "select", options: ["normal", "wide", "feature"] }
      - { label: "Gambar", name: "image", widget: "image" }

  - name: "profil_sekolah"
    label: "Profil Sekolah · Sejarah"
    icon: "history"
    description: "Ubah judul halaman dan linimasa sejarah sekolah."
    files:
      - label: "Profil dan sejarah"
        name: "profile"
        file: "smk-profile/data/school-profile.json"
        fields:
          - { label: "Judul hero", name: "heroTitle", widget: "string" }
          - { label: "Gambar hero", name: "heroImage", widget: "image" }
          - { label: "Teks alternatif gambar", name: "heroImageAlt", widget: "string" }
          - { label: "Label riwayat", name: "timelineEyebrow", widget: "string" }
          - { label: "Judul riwayat", name: "timelineHeading", widget: "string" }
          - label: "Linimasa sejarah"
            name: "timeline"
            widget: "list"
            fields:
              - { label: "Tahun", name: "year", widget: "string" }
              - { label: "Judul", name: "title", widget: "string" }
              - { label: "Cerita", name: "text", widget: "text" }
              - { label: "Gambar", name: "image", widget: "image" }
              - { label: "Teks alternatif gambar", name: "imageAlt", widget: "string" }

  - name: "pengaturan_situs"
    label: "Pengaturan Situs"
    icon: "settings"
    description: "Ubah identitas sekolah, navigasi, kontak, PPDB, dan media sosial."
    files:
      - label: "Identitas dan kontak"
        name: "settings"
        file: "smk-profile/data/site-settings.json"
        fields:
          - { label: "Nama sekolah", name: "schoolName", widget: "string" }
          - { label: "Slogan", name: "tagline", widget: "string" }
          - { label: "Tautan formulir PPDB", name: "ppdbUrl", widget: "string" }
          - label: "Navigasi situs"
            name: "navigation"
            widget: "list"
            fields:
              - { label: "Label menu", name: "label", widget: "string" }
              - { label: "Tautan", name: "href", widget: "string" }
              - label: "Submenu (opsional)"
                name: "items"
                widget: "list"
                required: false
                fields:
                  - { label: "Label submenu", name: "label", widget: "string" }
                  - { label: "Tautan", name: "href", widget: "string" }
          - label: "Kontak"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Telepon", name: "phone", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Judul alamat", name: "addressTitle", widget: "string" }
              - { label: "Baris alamat", name: "addressLines", widget: "list", field: { label: "Baris alamat", name: "line", widget: "string" } }
              - { label: "Judul email", name: "emailTitle", widget: "string" }
              - { label: "Keterangan email", name: "emailDescription", widget: "text" }
              - { label: "Judul jam operasional", name: "officeHoursTitle", widget: "string" }
              - { label: "Jam operasional", name: "officeHours", widget: "list", field: { label: "Jam", name: "line", widget: "string" } }
          - label: "Tautan footer"
            name: "footerLinks"
            widget: "list"
            fields:
              - { label: "Label tautan", name: "label", widget: "string" }
              - { label: "URL", name: "href", widget: "string" }
          - label: "Media sosial"
            name: "socials"
            widget: "list"
            fields:
              - { label: "Platform", name: "platform", widget: "select", options: ["facebook", "instagram", "twitter", "youtube", "linkedin"] }
              - { label: "URL profil", name: "url", widget: "string" }
